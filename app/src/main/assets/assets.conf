# Driving Test Lite - downloadable graphics & sounds
# Format:  key=filename_or_full_URL
#   - If value starts with http(s):// it is used as the full URL.
#   - Otherwise it is appended to @base (below, or repo variable ASSET_BASE_URL in GitHub).
# Missing/failed items fall back to built-in generated graphics/sounds, so the game always works.
# Keep files small: textures (png/jpg/webp, any size, auto-resized to 128x128),
# sounds (wav/ogg/mp3, short; engine = seamless loop). HTTPS only. Max 2 MB each.
@base=
road=road.png
grass=grass.png
building=building.png
engine=engine.wav
crash=crash.wav
beep=beep.wav
horn=horn.wav
success=success.wav
fail=fail.wav
# Example with full URL instead of @base:
# road=https://example.com/my-assets/asphalt.png
