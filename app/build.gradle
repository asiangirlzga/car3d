plugins { id 'com.android.application' }

android {
    namespace 'com.lite.drivingtest'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lite.drivingtest'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // installable APK (debug key)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// No dependencies on purpose: tiny APK, minimum RAM.
